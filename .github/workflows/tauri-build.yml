name: Build Windows App

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'src-tauri/**'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Build Tauri app
        run: npx tauri build
      - name: Locate built installer
        id: find_exe
        shell: bash
        run: |
          EXE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" | head -n 1)
          cp "$EXE" TRACE-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TRACE-Setup
          path: TRACE-Setup.exe
